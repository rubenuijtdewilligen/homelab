services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - nextcloud-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - nextcloud-net

  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - nextcloud-net

volumes:
  db-data:
  nextcloud-data:

networks:
  nextcloud-net:
    driver: bridge
