services:
  archivebox:
    image: archivebox/archivebox:latest
    restart: unless-stopped
    ports:
      - "5797:5797"
    environment:
      - ALLOWED_HOSTS=*
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PUBLIC_ADD_VIEW=False
    volumes:
      - ./data:/data
      - tmp:/tmp/archivebox
    shm_size: 1gb
    pids_limit: 2048

volumes:
  tmp:
