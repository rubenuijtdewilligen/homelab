services:
  sqldb:
    image: mysql:8.3
    restart: unless-stopped
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimaiuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: --default-storage-engine innodb
    healthcheck:
      test: mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kimai:
    image: kimai/kimai2:stable
    restart: unless-stopped
    depends_on:
      sqldb:
        condition: service_healthy
        restart: true
    volumes:
      - ./data/var_data:/opt/kimai/var/data
      - ./data/plugins:/opt/kimai/var/plugins
    ports:
      - "8001:8001"
    environment:
      - APP_SECRET=${APP_SECRET}
      - TRUSTED_HOSTS=^kimai\.c\.rbnu\.nl$
      - ADMINMAIL=${ADMINMAIL}
      - ADMINPASS=${ADMINPASS}
      - DATABASE_URL=mysql://kimaiuser:${MYSQL_PASSWORD}@sqldb/kimai?charset=utf8mb4&serverVersion=8.3.0
