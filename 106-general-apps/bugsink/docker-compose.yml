services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugsinkuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bugsink
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h db
      retries: 5
      start_period: 10s
      interval: 5s
      timeout: 5s

  web:
    image: bugsink/bugsink:2
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CREATE_SUPERUSER: ${SUPERUSER_EMAIL}:${SUPERUSER_PASSWORD}
      PORT: 8000
      DATABASE_URL: postgresql://bugsinkuser:${POSTGRES_PASSWORD}@db:5432/bugsink
      BASE_URL: "https://bugsink.c.rbnu.nl"
      BEHIND_HTTPS_PROXY: "true"
      USE_X_FORWARDED_HOST: "true"
      USE_X_REAL_IP: "false"
      USE_X_FORWARDED_FOR: "true"
      X_FORWARDED_FOR_PROXY_COUNT: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import requests; requests.get("http://localhost:8000/health/ready").raise_for_status()''',
        ]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  db-data:
